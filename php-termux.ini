; PHP Configuration for Termux
; Date settings
date.timezone = "Asia/Manila"

; Error reporting
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT
display_errors = On

; File uploads
file_uploads = On
upload_max_filesize = 10M
post_max_size = 10M

; Database settings
pdo_mysql.default_socket=
mysqli.default_host = localhost
mysqli.default_user = root
mysqli.default_pw =
mysqli.default_port = 3306
mysqli.default_socket = /data/data/com.termux/files/usr/var/run/mysqld.sock

; Memory limits
memory_limit = 128M
max_execution_time = 300
